<!DOCTYPE html >
<html>
<head>
    <meta charset="UTF-8">
    <!--Note this is important for 2 / 9 of the tests.-->
    <title>MurmurHash Terminal</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            margin: 4em;
            padding: 0;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }
        header, footer {
            color: #ffa500;
            margin-bottom: 0.5em;
            margin-top: 0.5em;
        }
        #terminal {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.9em;
            line-height: 1.4;
            margin-bottom: 1em;
            border: 1px solid #333;
            padding: 0.5em;
        }
        #shell {
            display: flex;
            align-items: center;
        }
        #shell .prompt {
            color: #ffa500;
            margin-right: 0.5em;
        }
        #command {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            width: 100%;
            outline: none;
            caret-color: #ffa500;
        }
        .error {
            color: #ff4500;
        }
        .success {
            color: #0f0;
        }
        .highlight {
            color: #ffa500;
        }
        #command-container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        #hash-display {
            color: #888;
            font-size: 0.8em;
            margin-top: 0.2em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
<header>MurmurHash Terminal</header>
<div id="terminal"></div>
<div id="command-container">
    <div id="shell">
        <span class="prompt">$</span>
        <input type="text" id="command" autocomplete="off" autofocus>
    </div>
    <div id="hash-display"></div>
</div>
<footer>v1.0.0</footer>
<!--<script src='https://murmurhash3.pages.dev/mm3_browser.js' integrity='sha256-PQ4EwRuTdFrfhz7YARixS5gxVYZSj59OuTXakeVJKGQ=' crossorigin='anonymous'></script>-->

<script  integrity='sha256-PQ4EwRuTdFrfhz7YARixS5gxVYZSj59OuTXakeVJKGQ=' src="./mm3_browser.js"></script>
<script>
    const terminal = document.getElementById('terminal');
    const commandInput = document.getElementById('command');
    const hashDisplay = document.getElementById('hash-display');

    // Available commands for autocomplete
    const commands = [
        'test', 'tests', 'benchmark', 'collision', 'distribution',
        'hash', 'clear', 'help', 'base64', 'hex', 'time', 'random'
    ];

    let autocompleteIndex = 0;
    let lastCommand = '';

    function print(text, className = '') {
        const line = document.createElement('div');
        line.innerText = text;
        if (className) line.className = className;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function type(text) {
        print(`> ${text}`);
    }

    function printResult(passed, message) {
        const className = passed ? 'success' : 'error';
        print(`[${passed ? 'PASS' : 'FAIL'}] ${message}`, className);
    }

    // Update hash display in real-time
    function updateHashDisplay() {
        const input = commandInput.value;
        if (input.trim() === '') {
            hashDisplay.textContent = '';
            return;
        }
        try {
            const hash = murmurhash3(input);
            const hex = bytesToHex(hash);
            const base64 = hexToBase64(hex);
            const chunks = hex.match(/.{1,2}/g) || []; // split hex string into byte chuncks

            hashDisplay.innerHTML = `
Hash: 0x${hex} | Base64: ${base64}
<br>
<b>Raw:</b> [${hash.join(", ")}]
<br>
<b>Hex:</b>  [${chunks.join(", ")}]
`;
        } catch (e) {
            hashDisplay.textContent = 'Hash: Error';
        }
    }

    // Autocomplete functionality
    function autocomplete() {
        const input = commandInput.value;
        const parts = input.split(' ');
        const currentWord = parts[parts.length - 1];

        // Find all commands that start with currentWord
        const matches = commands.filter(cmd =>
            cmd.startsWith(currentWord)
        );

        if (matches.length === 0) {
            return;
        }

        // Cycle through matches
        autocompleteIndex = (autocompleteIndex + 1) % matches.length;
        const match = matches[autocompleteIndex];

        // Replace the current word with the matched command
        parts[parts.length - 1] = match;
        commandInput.value = parts.join(' ');

        // Update hash display
        updateHashDisplay();
    }

    function handleTabKey(e) {
        e.preventDefault();
        autocomplete();
    }

    // Test vectors
    const ascendingBuf =
        "\x00\x01\x02\x03\x04\x05\x06\x07" +
        "\x08\x09\x0a\x0b\x0c\x0d\x0e\x0f" +
        "\x10\x11\x12\x13\x14\x15\x16\x17" +
        "\x18\x19\x1a\x1b\x1c\x1d\x1e\x1f" +
        "\x20\x21\x22\x23\x24\x25\x26\x27" +
        "\x28\x29\x2a\x2b\x2c\x2d\x2e\x2f" +
        "\x30\x31\x32\x33\x34\x35\x36\x37" +
        "\x38\x39\x3a\x3b\x3c\x3d\x3e\x3f";

    const testVectors = {
        "": [0, "00000000000000000000000000000000", "00000000000000000000000000000000"],
        [ascendingBuf]: [2303633163, "cc32c3983052e6520858cfaa82d82209", "ffd5522d8d812301a22238eb56338ea1"],
        [ascendingBuf.slice(0, 31)]: [1682074326, "24ab92eeac1d89ca45f5bc189ad5dda3", "053dd3e1a32cd0949ee59aefb4005490"],
        "I will not buy this record, it is scratched.": [2832214938, "a0a9683b25ac5e40d9af2895890dddf5", "c382657f9a06c49d4a71fdc6d9b0d48f"],
        "I will not buy this tobacconist's, it is scratched.": [1720269489, "9b5b7ba2ef3f7866889adeaf00f3f98e", "d30654abbd8227e367d73523f0079673"],
        "My hovercraft is full of eels.": [2953494853, "e3a186aee169ba6c6a8bd9343c68fa9c", "03e5e14d358c16d1e5ae86df7ed5cfcb"],
        "我的气垫船装满了鳗鱼。": [4193185573, "4a3b1d7c5f2763c2d6d5551f5f1e922f", "454d3f37ec1eb384ab6fb47de3d07525"],
        "My rocket is full of lizards.": [1818098979, "e616d85ffee7f678dab461995b5bb90f", "d047391e58c6c9dfccde62c92e049f50"],
        "My 🚀 is full of 🦎.": [1818098979, "e616d85ffee7f678dab461995b5bb90f", "d047391e58c6c9dfccde62c92e049f50"],

    };

    const bytesEqual = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

    function runTests() {
        print('Running hash tests...', 'highlight');
        let passedCount = 0;
        let totalCount = 0;

        for (const [k, v] of Object.entries(testVectors)) {
            totalCount++;
            const x64mm3128 = v[2];
            const bytes = hexToBytes(x64mm3128);
            const hash = murmurhash3(k);
            const hex = bytesToHex(hash);
            const passed = hex === x64mm3128;

            if (passed) passedCount++;

            const inputDisplay = k.length > 30 ? k.substring(0, 30) + '...' : k;
            const hexDisplay = hex.substring(0, 16) + '...';

            printResult(
                passed,
                `${inputDisplay} -> 0x${hexDisplay} | base64: ${hexToBase64(hex)}`
            );
        }

        print(`\\nTest Results: ${passedCount}/${totalCount} passed`, 'highlight');
        return passedCount === totalCount;
    }

    function trailingZeroByteCount(u8) {
        for (let i = u8.length - 1, c = 0; i >= 0; i--, c++) {
            if (u8[i] !== 0) return c;
        }
        return u8.length;
    }

    function findInputWithAtLeastNTrailingZeroBytes(n, maxIters = 5_000_000, seedStart = 0) {
        let i = seedStart;
        for (; i < seedStart + maxIters; i++) {
            const input = `bench:${i}`;
            const h = murmurhash3(input);
            if (trailingZeroByteCount(h) >= n) return { input, hash: h, iters: i - seedStart + 1 };
        }
        return null;
    }

    async function runBenchmark() {
        print('Running trailing zero bytes benchmark...', 'highlight');
        print('Searching for inputs with increasing trailing zero bytes...');

        const k = 3;
        const maxIters = 200_000_000;
        const results = [];

        for (let n = 0; n <= 3; n++) {
            print(`\\nSearching for inputs with at least ${n} trailing zero byte(s)...`, 'highlight');

            let totalMs = 0;
            let totalIters = 0;
            let foundCount = 0;

            for (let sample = 0; sample < k; sample++) {
                const seedStart = sample * 10_000_000;
                const t0 = performance.now();
                const found = findInputWithAtLeastNTrailingZeroBytes(n, maxIters, seedStart);
                const t1 = performance.now();

                const ms = t1 - t0;
                totalMs += ms;

                if (found) {
                    totalIters += found.iters;
                    foundCount++;
                    print(
                        `  Sample ${sample + 1}: Found \"${found.input}\" with ${trailingZeroByteCount(found.hash)} trailing zeros | Time: ${ms.toFixed(2)}ms | Iterations: ${found.iters}`
                    );
                } else {
                    print(`  Sample ${sample + 1}: Not found within ${maxIters} iterations`);
                }
            }

            results.push({
                n,
                avgMs: totalMs / k,
                avgIters: totalIters / (foundCount || 1),
                foundRate: foundCount / k
            });
        }

        print('\\nBenchmark Summary:', 'highlight');
        print('n | Avg Time (ms) | Avg Iterations | Found Rate');
        print('-'.repeat(50));

        for (const result of results) {
            print(
                `${result.n} | ${result.avgMs.toFixed(2)} | ${Math.round(result.avgIters).toLocaleString()} | ${(result.foundRate * 100).toFixed(0)}%`
            );
        }
    }

    async function runCollisionTest() {
        print('Running collision detection test...', 'highlight');
        const seen = new Map();

        const maxAttempts = 10_000_000;
        const batchSize = 500_000;

        print('Searching for two different inputs with the same hash... ', maxAttempts);

        let foundCollision = false;

        for (let i = 0; i < maxAttempts; i++) {
            const input = `collision_test_${i}`;
            const hash = murmurhash3(input);
            const hex = bytesToHex(hash);

            if (seen.has(hex)) {
                const existingInput = seen.get(hex);

                print(`Collision found!`, 'success');
                print(`  Input 1: ${existingInput}`);
                print(`  Input 2: ${input}`);
                print(`  Hash: 0x${hex}`);

                foundCollision = true;
                break;
            }

            seen.set(hex, input);

            // Yield to browser every batch
            if (i > 0 && i % batchSize === 0) {
                print(`Done ${i / 1000}k`);

                await new Promise(resolve => {
                    setTimeout(resolve, 0);
                });
            }
        }

        if (!foundCollision) {
            print(`No collisions found after ${maxAttempts} attempts.`, 'error');
        }
    }

    function runDistributionTest() {
        print('Running hash distribution test...', 'highlight');
        print('Checking distribution of hash bytes...');

        const byteCounts = new Array(256).fill(0);
        const sampleSize = 100_000;

        for (let i = 0; i < sampleSize; i++) {
            const input = `dist_test_${i}`;
            const hash = murmurhash3(input);
            for (const byte of hash) {
                byteCounts[byte]++;
            }
        }

        const expectedCount = (sampleSize * 16) / 256;
        let maxDeviation = 0;
        let maxByte = 0;

        for (let i = 0; i < 256; i++) {
            const deviation = Math.abs(byteCounts[i] - expectedCount);
            if (deviation > maxDeviation) {
                maxDeviation = deviation;
                maxByte = i;
            }
        }

        const deviationPercent = (maxDeviation / expectedCount * 100).toFixed(2);
        print(`Sample size: ${sampleSize} hashes (${sampleSize * 16} bytes)`);
        print(`Expected count per byte value: ${expectedCount.toFixed(0)}`);
        print(`Max deviation: byte ${maxByte} (${byteCounts[maxByte]} occurrences, ${deviationPercent}% from expected)`);

        if (deviationPercent < 5) {
            print('Distribution looks good!', 'success');
        } else {
            print('Distribution may be skewed.', 'error');
        }
    }

    // New utility: base64 encode/decode
    function runBase64Command(args) {
        if (args.length === 0) {
            print('Usage: base64 encode <text> | base64 decode <base64>', 'error');
            return;
        }

        const mode = args[0].toLowerCase();
        const input = args.slice(1).join(' ');

        if (mode === 'encode') {
            const bytes = strToBuf(input);
            const hex = bytesToHex(bytes);
            const base64 = hexToBase64(hex);
            print(`Base64: ${base64}`);
        } else if (mode === 'decode') {
            try {
                const bytes = hexToBytes(input);
                const text = String.fromCharCode.apply(null, bytes);
                print(`Decoded: ${text}`);
            } catch (e) {
                print('Invalid base64 input', 'error');
            }
        } else {
            print('Usage: base64 encode <text> | base64 decode <base64>', 'error');
        }
    }

    // New utility: hex encode/decode
    function runHexCommand(args) {
        if (args.length === 0) {
            print('Usage: hex encode <text> | hex decode <hex>', 'error');
            return;
        }

        const mode = args[0].toLowerCase();
        const input = args.slice(1).join(' ');

        if (mode === 'encode') {
            const bytes = strToBuf(input);
            const hex = bytesToHex(bytes);
            print(`Hex: 0x${hex}`);
        } else if (mode === 'decode') {
            try {
                const bytes = hexToBytes(input);
                const text = String.fromCharCode.apply(null, bytes);
                print(`Decoded: ${text}`);
            } catch (e) {
                print('Invalid hex input', 'error');
            }
        } else {
            print('Usage: hex encode <text> | hex decode <hex>', 'error');
        }
    }

    // New utility: time command
    function runTimeCommand(args) {
        if (args.length === 0) {
            print('Usage: time <command> [args...]', 'error');
            return;
        }

        const command = args.join(' ');
        const start = performance.now();
        // Execute the command
        type(command);
        processCommand(command);
        const end = performance.now();

        print(`Execution time: ${(end - start).toFixed(2)}ms`, 'highlight');
    }

    // New utility: random string generator
    function runRandomCommand(args) {
        const length = args.length > 0 ? parseInt(args[0]) || 16 : 16;
        const count = args.length > 1 ? parseInt(args[1]) || 1 : 1;

        for (let i = 0; i < count; i++) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let randomString = '';
            for (let j = 0; j < length; j++) {
                randomString += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const hash = murmurhash3(randomString);
            const hex = bytesToHex(hash);
            print(`Random string: ${randomString}`);
            print(`Hash: 0x${hex}`);
        }
    }

    function initShell() {
        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const command = commandInput.value.trim();
                commandInput.value = '';
                hashDisplay.textContent = '';
                if (command) {
                    type(command);
                    processCommand(command);
                }
            } else if (e.key === 'Tab') {
                handleTabKey(e);
            } else {
                // Update hash display as user types
                updateHashDisplay();
            }
        });

        // Also update on input for paste events
        commandInput.addEventListener('input', updateHashDisplay);

        terminal.addEventListener("click", e=>{
            commandInput.focus()
        })

    }

    function processCommand(command) {
        const parts = command.split(' ');
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);

        switch (cmd) {
            case 'test':
            case 'tests':
                runTests();
                break;
            case 'benchmark':
                runBenchmark();
                break;
            case 'collision':
                runCollisionTest();
                break;
            case 'distribution':
                runDistributionTest();
                break;
            case 'hash':
                if (args.length === 0) {
                    print('Usage: hash <input>', 'error');
                } else {
                    const input = args.join(' ');
                    const hash = murmurhash3(input);
                    const hex = bytesToHex(hash);
                    const base64 = hexToBase64(hex);
                    print(`Input: ${input}`);
                    print(`Hash (hex): 0x${hex}`);
                    print(`Hash (base64): ${base64}`);
                    print(`Trailing zeros: ${trailingZeroByteCount(hash)}`);
                }
                break;
            case 'base64':
                runBase64Command(args);
                break;
            case 'hex':
                runHexCommand(args);
                break;
            case 'time':
                runTimeCommand(args);
                break;
            case 'random':
                runRandomCommand(args);
                break;
            case 'clear':
                terminal.innerHTML = '';
                break;
            case 'help':
                print('Available commands:');
                print('  test         - Run hash tests');
                print('  benchmark    - Run trailing zero bytes benchmark');
                print('  collision    - Run collision detection test');
                print('  distribution - Run hash distribution test');
                print('  hash <input> - Compute hash of input');
                print('  base64 <encode|decode> <text> - Base64 encode/decode');
                print('  hex <encode|decode> <text> - Hex encode/decode');
                print('  time <command> - Measure execution time of a    command');
                print('  random [length] [count] - Generate random strings and hash them');
                print('  clear        - Clear the terminal');
                print('  help         - Show this help');
                break;
            default:
                // If it's not a command, treat it as input to hash
                const hash = murmurhash3(command);
                const hex = bytesToHex(hash);
                const base64 = hexToBase64(hex);
                print(`Hash of "${command}":`);
                print(`  Hex: 0x${hex}`);
                print(`  Base64: ${base64}`);
                print(`  Trailing zeros: ${trailingZeroByteCount(hash)}`);
        }
    }

    window.onload = () => {
        print('MurmurHash Terminal v1.0.0');
        print('Type "help" for available commands.');
        print('');
        initShell();
        commandInput.focus();
    };

</script>
</body>
</html>
