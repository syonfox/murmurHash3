name: Deploy Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # If you have a build step, run it here
      # - run: pnpm build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./   # or ./dist if built

      - name: Deploy
        uses: actions/deploy-pages@v4